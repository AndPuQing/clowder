name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example v0.1.0)"
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}

jobs:
  linux:
    name: linux-amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: Install GTK3 + WebKitGTK 4.1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev pkg-config

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          set -eu
          mkdir -p out
          LDFLAGS="-s -w -X github.com/AndPuQing/clowder/core.Version=${VERSION}"
          go build -trimpath -ldflags "$LDFLAGS" -o out/clowder ./cmd/clowder
          tar -czf out/clowder-linux-amd64.tar.gz -C out clowder
          ( cd out && sha256sum clowder-linux-amd64.tar.gz > clowder-linux-amd64.sha256 )

      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: out/clowder-linux-amd64.*
          if-no-files-found: error

  linux-headless:
    name: linux-headless (amd64 + arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      # The CLI imports no cgo packages, so it is a static binary. It needs
      # no GTK, WebKitGTK or libc and runs on a minimal server image.
      - name: Build static binaries
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          mkdir -p out
          LDFLAGS="-s -w -X github.com/AndPuQing/clowder/core.Version=${VERSION}"
          for arch in amd64 arm64; do
            d="out/headless-$arch"
            mkdir -p "$d"
            GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" \
              -o "$d/clowderd" ./cmd/clowderd
            file "$d/clowderd" | grep -q "statically linked"
            cp packaging/clowderd.service "$d/"
            cp docs/HEADLESS.md "$d/README.md"
            cp LICENSE "$d/"
            tar -czf "out/clowderd-linux-$arch.tar.gz" -C "$d" .
            ( cd out && sha256sum "clowderd-linux-$arch.tar.gz" \
                > "clowderd-linux-$arch.sha256" )
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-headless
          path: |
            out/clowderd-linux-*.tar.gz
            out/clowderd-linux-*.sha256
          if-no-files-found: error

  macos:
    name: darwin (amd64 + arm64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      # The runner is Intel; use clang -arch to cross-build arm64, one .app per arch
      - name: Build both arches
        env:
          CGO_ENABLED: "1"
        run: |
          set -eu
          mkdir -p out
          LDFLAGS="-s -w -X github.com/AndPuQing/clowder/core.Version=${VERSION}"

          # Go's GOARCH names differ from clang's -arch names
          clang_arch() {
            case "$1" in
              amd64) echo x86_64 ;;
              *) echo "$1" ;;
            esac
          }

          for arch in amd64 arm64; do
            d="out/$arch"
            ca="$(clang_arch "$arch")"
            mkdir -p "$d"
            for cmd in clowder clowderd; do
              CGO_CFLAGS="-arch $ca" CGO_LDFLAGS="-arch $ca" CC=clang \
                GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" \
                -o "$d/$cmd" "./cmd/$cmd"
            done

            app="$d/Clowder.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp "$d/clowder" "$app/Contents/MacOS/Clowder"
            cp "$d/clowderd" "$app/Contents/MacOS/clowderd"
            cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Clowder</string>
            <key>CFBundleDisplayName</key><string>Clowder</string>
            <key>CFBundleIdentifier</key><string>dev.clowder.app</string>
            <key>CFBundleExecutable</key><string>Clowder</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION#v}</string>
            <key>CFBundleVersion</key><string>${VERSION#v}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

            ( cd "$d" && zip -qry "clowder-darwin-$arch.zip" Clowder.app )
            mv "$d/clowder-darwin-$arch.zip" out/
            ( cd out && shasum -a 256 "clowder-darwin-$arch.zip" \
                > "clowder-darwin-$arch.sha256" )
          done

          ls -lh out/*.zip out/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: |
            out/clowder-darwin-amd64.zip
            out/clowder-darwin-arm64.zip
            out/clowder-darwin-*.sha256
          if-no-files-found: error

  windows:
    name: windows-amd64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -eu
          mkdir -p out
          LDFLAGS="-s -w -X github.com/AndPuQing/clowder/core.Version=${VERSION}"
          go build -trimpath -ldflags "$LDFLAGS" -o out/clowder.exe ./cmd/clowder
          go build -trimpath -ldflags "$LDFLAGS" -o out/clowderd.exe ./cmd/clowderd
          ( cd out && tar -a -c -f clowder-windows-amd64.zip clowder.exe clowderd.exe )
          ( cd out && sha256sum clowder-windows-amd64.zip > clowder-windows-amd64.sha256 )

      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: |
            out/clowder-windows-amd64.zip
            out/clowder-windows-amd64.sha256
          if-no-files-found: error

  release:
    needs: [linux, linux-headless, macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Clowder ${{ github.ref_name }}

            | Platform | File | Before you run it |
            |---|---|---|
            | macOS (Apple Silicon) | `clowder-darwin-arm64.zip` | — |
            | macOS (Intel) | `clowder-darwin-amd64.zip` | — |
            | Windows | `clowder-windows-amd64.zip` | WebView2 (included in Windows 11) |
            | Linux (GUI) | `clowder-linux-amd64.tar.gz` | `libgtk-3-0`, `libwebkit2gtk-4.1-0`, `libayatana-appindicator3-1` (tray) |
            | Linux headless (amd64) | `clowderd-linux-amd64.tar.gz` | — (static binary) |
            | Linux headless (arm64) | `clowderd-linux-arm64.tar.gz` | — (static binary) |

            On macOS, unzip and drag `Clowder.app` into Applications. If the
            system blocks the first launch, right-click it and choose Open.
            The `clowderd-*` archives contain the static CLI, a systemd unit
            and install notes; see `README.md` inside. Each archive has a
            `.sha256` checksum file.