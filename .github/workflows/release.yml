name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签（例如 v0.1.0）"
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}

jobs:
  linux:
    name: linux-amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: Install GTK3 + WebKitGTK 4.1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev pkg-config

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          set -eu
          mkdir -p out
          LDFLAGS="-s -w -X github.com/AndPuQing/clowder/core.Version=${VERSION}"
          go build -trimpath -ldflags "$LDFLAGS" -o out/clowder ./cmd/clowder
          go build -trimpath -ldflags "$LDFLAGS" -o out/clowderd ./cmd/clowderd
          tar -czf out/clowder-linux-amd64.tar.gz -C out clowder clowderd
          ( cd out && sha256sum clowder-linux-amd64.tar.gz > clowder-linux-amd64.sha256 )

      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: out/clowder-linux-amd64.*
          if-no-files-found: error

  macos:
    name: darwin (amd64 + arm64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      # Runner 是 Intel，用 clang -arch 交叉出 arm64，两个架构各打一个 .app
      - name: Build both arches
        env:
          CGO_ENABLED: "1"
        run: |
          set -eu
          mkdir -p out
          LDFLAGS="-s -w -X github.com/AndPuQing/clowder/core.Version=${VERSION}"

          # Go 的 GOARCH 与 clang 的 -arch 名称不同
          clang_arch() {
            case "$1" in
              amd64) echo x86_64 ;;
              *) echo "$1" ;;
            esac
          }

          for arch in amd64 arm64; do
            d="out/$arch"
            ca="$(clang_arch "$arch")"
            mkdir -p "$d"
            for cmd in clowder clowderd; do
              CGO_CFLAGS="-arch $ca" CGO_LDFLAGS="-arch $ca" CC=clang \
                GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" \
                -o "$d/$cmd" "./cmd/$cmd"
            done

            app="$d/Clowder.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp "$d/clowder" "$app/Contents/MacOS/Clowder"
            cp "$d/clowderd" "$app/Contents/MacOS/clowderd"
            cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Clowder</string>
            <key>CFBundleDisplayName</key><string>Clowder</string>
            <key>CFBundleIdentifier</key><string>dev.clowder.app</string>
            <key>CFBundleExecutable</key><string>Clowder</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION#v}</string>
            <key>CFBundleVersion</key><string>${VERSION#v}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

            ( cd "$d" && zip -qry "clowder-darwin-$arch.zip" Clowder.app )
            mv "$d/clowder-darwin-$arch.zip" out/
            ( cd out && shasum -a 256 "clowder-darwin-$arch.zip" \
                > "clowder-darwin-$arch.sha256" )
          done

          ls -lh out/*.zip out/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: |
            out/clowder-darwin-amd64.zip
            out/clowder-darwin-arm64.zip
            out/clowder-darwin-*.sha256
          if-no-files-found: error

  windows:
    name: windows-amd64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -eu
          mkdir -p out
          LDFLAGS="-s -w -X github.com/AndPuQing/clowder/core.Version=${VERSION}"
          go build -trimpath -ldflags "$LDFLAGS" -o out/clowder.exe ./cmd/clowder
          go build -trimpath -ldflags "$LDFLAGS" -o out/clowderd.exe ./cmd/clowderd
          ( cd out && tar -a -c -f clowder-windows-amd64.zip clowder.exe clowderd.exe )
          ( cd out && sha256sum clowder-windows-amd64.zip > clowder-windows-amd64.sha256 )

      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: |
            out/clowder-windows-amd64.zip
            out/clowder-windows-amd64.sha256
          if-no-files-found: error

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Clowder ${{ github.ref_name }}

            | 平台 | 文件 | 运行前需要 |
            |---|---|---|
            | macOS (Apple Silicon) | `clowder-darwin-arm64.zip` | — |
            | macOS (Intel) | `clowder-darwin-amd64.zip` | — |
            | Windows | `clowder-windows-amd64.zip` | WebView2（Win11 自带） |
            | Linux | `clowder-linux-amd64.tar.gz` | `libgtk-3-0`、`libwebkit2gtk-4.1-0`、`libayatana-appindicator3-1`（托盘） |

            macOS 解压后把 `Clowder.app` 拖进「应用程序」；首次打开若被系统拦，
            右键 → 打开。命令行版本 `clowderd` 随包提供。每个包附 `.sha256` 校验文件。