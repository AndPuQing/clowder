name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签（例如 v0.1.0）"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-amd64
            ext: ""
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            ext: ""
          - os: macos-14
            artifact: darwin-arm64
            ext: ""
          - os: macos-13
            artifact: darwin-amd64
            ext: ""
          - os: windows-2022
            artifact: windows-amd64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/AndPuQing/clowder/core.Version=${VERSION}"
          go build -trimpath -ldflags "$LDFLAGS" -o "dist/clowder${{ matrix.ext }}" ./cmd/clowder
          go build -trimpath -ldflags "$LDFLAGS" -o "dist/clowderd${{ matrix.ext }}" ./cmd/clowderd

      # macOS 打成 .app，双击即可运行
      - name: Bundle macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          APP="dist/Clowder.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp dist/clowder "$APP/Contents/MacOS/Clowder"
          cp dist/clowderd "$APP/Contents/MacOS/clowderd"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Clowder</string>
            <key>CFBundleDisplayName</key><string>Clowder</string>
            <key>CFBundleIdentifier</key><string>dev.clowder.app</string>
            <key>CFBundleExecutable</key><string>Clowder</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION#v}</string>
            <key>CFBundleVersion</key><string>${VERSION#v}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          cd dist
          if [ "${{ runner.os }}" = "macOS" ]; then
            zip -qry "clowder-${{ matrix.artifact }}.zip" Clowder.app
          else
            tar -czf "clowder-${{ matrix.artifact }}.tar.gz" clowder clowderd
          fi
          sha256sum clowder-${{ matrix.artifact }}.* | tee "clowder-${{ matrix.artifact }}.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          cd dist
          tar -a -c -f "clowder-${{ matrix.artifact }}.zip" clowder.exe clowderd.exe
          sha256sum "clowder-${{ matrix.artifact }}.zip" | tee "clowder-${{ matrix.artifact }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: clowder-${{ matrix.artifact }}
          path: |
            dist/clowder-${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Clowder ${{ github.ref_name }}

            - **Linux**：需要 GTK3 与 WebKitGTK 4.1
              `sudo apt install libgtk-3-0 libwebkit2gtk-4.1-0`
            - **macOS**：解压后把 `Clowder.app` 拖进「应用程序」。首次打开若被拦，
              右键 → 打开。
            - **Windows**：需要 WebView2 运行时（Windows 11 自带）。

            命令行版本 `clowderd` 随包提供，用法见 README。