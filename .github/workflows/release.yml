name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to build (for example v0.7.0)"
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  linux:
    name: linux-amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: Install GTK3 + WebKitGTK 4.1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev pkg-config

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          set -eu
          mkdir -p out
          LDFLAGS="-s -w -X github.com/AndPuQing/clowder/core.Version=${VERSION}"
          go build -trimpath -ldflags "$LDFLAGS" -o out/clowder-linux-amd64 ./cmd/clowder
          ( cd out && sha256sum clowder-linux-amd64 > clowder-linux-amd64.sha256 )

      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            out/clowder-linux-amd64
            out/clowder-linux-amd64.sha256
          if-no-files-found: error

  linux-headless:
    name: linux-headless (amd64 + arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      # The CLI imports no cgo packages, so it is a static binary. It needs
      # no GTK, WebKitGTK or libc and runs on a minimal server image.
      - name: Build static binaries
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          mkdir -p out
          LDFLAGS="-s -w -X github.com/AndPuQing/clowder/core.Version=${VERSION}"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" \
              -o "out/clowderd-linux-$arch" ./cmd/clowderd
            file "out/clowderd-linux-$arch" | grep -q "statically linked"
            ( cd out && sha256sum "clowderd-linux-$arch" \
                > "clowderd-linux-$arch.sha256" )
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-headless
          path: |
            out/clowderd-linux-amd64
            out/clowderd-linux-amd64.sha256
            out/clowderd-linux-arm64
            out/clowderd-linux-arm64.sha256
          if-no-files-found: error

  macos:
    name: darwin (amd64 + arm64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      # The runner is Intel; use clang -arch to cross-build arm64. Each arch
      # gets a DMG with Clowder.app; the CLI is also attached as a raw binary
      # for scripts.
      - name: Build both arches
        env:
          CGO_ENABLED: "1"
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -eu
          mkdir -p out
          LDFLAGS="-s -w -X github.com/AndPuQing/clowder/core.Version=${VERSION}"

          sign_args=(--sign -)
          signing_dir=""
          mount_dir=""
          cleanup() {
            if [ -n "$mount_dir" ]; then
              hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
              rmdir "$mount_dir" || true
            fi
            if [ -n "$signing_dir" ]; then
              security delete-keychain "$signing_dir/release.keychain-db" || true
              rm -rf "$signing_dir"
            fi
          }
          trap cleanup EXIT

          if [ -n "${MACOS_CERTIFICATE}${MACOS_CERTIFICATE_PASSWORD}${MACOS_NOTARY_KEY}${MACOS_NOTARY_KEY_ID}${MACOS_NOTARY_ISSUER_ID}" ]; then
            : "${MACOS_CERTIFICATE:?Set the base64-encoded Developer ID certificate}"
            : "${MACOS_CERTIFICATE_PASSWORD:?Set the Developer ID certificate password}"
            : "${MACOS_NOTARY_KEY:?Set the App Store Connect API private key}"
            : "${MACOS_NOTARY_KEY_ID:?Set the App Store Connect key ID}"
            : "${MACOS_NOTARY_ISSUER_ID:?Set the App Store Connect issuer ID}"

            signing_dir=$(mktemp -d "$RUNNER_TEMP/clowder-signing.XXXXXX")
            keychain="$signing_dir/release.keychain-db"
            keychain_password=$(openssl rand -hex 24)
            printf '%s' "$MACOS_CERTIFICATE" | base64 -D > "$signing_dir/developer-id.p12"
            printf '%s\n' "$MACOS_NOTARY_KEY" > "$signing_dir/notary.p8"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 7200 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security list-keychains -d user -s "$keychain"
            security import "$signing_dir/developer-id.p12" -f pkcs12 -k "$keychain" \
              -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
            identity=$(security find-identity -v -p codesigning "$keychain" |
              awk '/"Developer ID Application: / {print $2; exit}')
            : "${identity:?The certificate must be a valid Developer ID Application identity}"
            sign_args=(--sign "$identity" --keychain "$keychain" --options runtime --timestamp)
          fi

          # Go's GOARCH names differ from clang's -arch names
          clang_arch() {
            case "$1" in
              amd64) echo x86_64 ;;
              *) echo "$1" ;;
            esac
          }

          for arch in amd64 arm64; do
            d="out/$arch"
            ca="$(clang_arch "$arch")"
            mkdir -p "$d"
            for cmd in clowder clowderd; do
              CGO_CFLAGS="-arch $ca" CGO_LDFLAGS="-arch $ca" CC=clang \
                GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" \
                -o "$d/$cmd" "./cmd/$cmd"
            done

            app="$d/Clowder.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp "$d/clowder" "$app/Contents/MacOS/Clowder"
            cp "$d/clowderd" "$app/Contents/MacOS/clowderd"
            cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Clowder</string>
            <key>CFBundleDisplayName</key><string>Clowder</string>
            <key>CFBundleIdentifier</key><string>dev.clowder.app</string>
            <key>CFBundleExecutable</key><string>Clowder</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION#v}</string>
            <key>CFBundleVersion</key><string>${VERSION#v}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

            codesign --force "${sign_args[@]}" "$app/Contents/MacOS/clowderd"
            codesign --force "${sign_args[@]}" "$app"
            codesign --verify --deep --strict --verbose=2 "$app"

            stage="$d/dmg"
            dmg="out/clowder-darwin-$arch.dmg"
            mkdir -p "$stage"
            ditto "$app" "$stage/Clowder.app"
            ln -s /Applications "$stage/Applications"
            hdiutil create -volname "Clowder" -srcfolder "$stage" -ov -format UDZO "$dmg"
            if [ -n "$signing_dir" ]; then
              codesign --force --sign "$identity" --keychain "$keychain" --timestamp "$dmg"
              xcrun notarytool submit "$dmg" --key "$signing_dir/notary.p8" \
                --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" --wait
              xcrun stapler staple "$dmg"
              xcrun stapler validate "$dmg"
            fi

            hdiutil verify "$dmg"
            mount_dir=$(mktemp -d "$RUNNER_TEMP/clowder-mount.XXXXXX")
            hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
            mounted_app="$mount_dir/Clowder.app"
            codesign --verify --deep --strict --verbose=2 "$mounted_app"
            [ "$(lipo -archs "$mounted_app/Contents/MacOS/Clowder")" = "$ca" ]
            [ "$(lipo -archs "$mounted_app/Contents/MacOS/clowderd")" = "$ca" ]
            if [ "$ca" = "$(uname -m)" ]; then
              [ "$("$mounted_app/Contents/MacOS/Clowder" --version)" = "clowder $VERSION" ]
              [ "$("$mounted_app/Contents/MacOS/clowderd" --version)" = "clowderd $VERSION" ]
            fi
            hdiutil detach "$mount_dir"
            if [ -d "$mount_dir" ]; then
              rmdir "$mount_dir"
            fi
            mount_dir=""
            ( cd out && shasum -a 256 "clowder-darwin-$arch.dmg" \
                > "clowder-darwin-$arch.dmg.sha256" )

            cp "$app/Contents/MacOS/clowderd" "out/clowderd-darwin-$arch"
            ( cd out && shasum -a 256 "clowderd-darwin-$arch" \
                > "clowderd-darwin-$arch.sha256" )
          done

          ls -lh out/*.dmg out/*.sha256 out/clowderd-darwin-*

      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: |
            out/clowder-darwin-*.dmg
            out/clowder-darwin-*.dmg.sha256
            out/clowderd-darwin-amd64
            out/clowderd-darwin-amd64.sha256
            out/clowderd-darwin-arm64
            out/clowderd-darwin-arm64.sha256
          if-no-files-found: error

  windows:
    name: windows-amd64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -eu
          mkdir -p out
          LDFLAGS="-s -w -X github.com/AndPuQing/clowder/core.Version=${VERSION}"
          go build -trimpath -ldflags "$LDFLAGS" -o out/clowder-windows-amd64.exe ./cmd/clowder
          go build -trimpath -ldflags "$LDFLAGS" -o out/clowderd-windows-amd64.exe ./cmd/clowderd
          ( cd out && sha256sum clowder-windows-amd64.exe > clowder-windows-amd64.exe.sha256 )
          ( cd out && sha256sum clowderd-windows-amd64.exe > clowderd-windows-amd64.exe.sha256 )

      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: |
            out/clowder-windows-amd64.exe
            out/clowder-windows-amd64.exe.sha256
            out/clowderd-windows-amd64.exe
            out/clowderd-windows-amd64.exe.sha256
          if-no-files-found: error

  release:
    needs: [linux, linux-headless, macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
            packaging/clowderd.service
            docs/HEADLESS.md
          generate_release_notes: true
          body: |
            Clowder ${{ github.ref_name }}

            | Platform | File | Before you run it |
            |---|---|---|
            | macOS (Apple Silicon) | `clowder-darwin-arm64.dmg` | Open the DMG, drag `Clowder.app` to Applications |
            | macOS (Intel) | `clowder-darwin-amd64.dmg` | Same |
            | macOS CLI (amd64) | `clowderd-darwin-amd64` | `chmod +x`; remove quarantine |
            | macOS CLI (arm64) | `clowderd-darwin-arm64` | `chmod +x`; remove quarantine |
            | Windows | `clowder-windows-amd64.exe`, `clowderd-windows-amd64.exe` | WebView2 for the GUI |
            | Linux (GUI) | `clowder-linux-amd64` | `chmod +x`; GTK, WebKitGTK, appindicator |
            | Linux headless (amd64) | `clowderd-linux-amd64` | `chmod +x`; static |
            | Linux headless (arm64) | `clowderd-linux-arm64` | `chmod +x`; static |

            Open the macOS DMG and drag `Clowder.app` to Applications. If macOS
            blocks a build that you trust, check **System Settings → Privacy &
            Security** for **Open Anyway**. The CLI is also inside
            `Clowder.app/Contents/MacOS/clowderd`.

            Outside macOS, release assets are plain binaries, not archives:
            `chmod +x` and run. macOS CLI downloads are quarantined; remove
            the attribute with `xattr -d com.apple.quarantine <file>`.

            Every binary and DMG has a `.sha256`. `clowderd.service` and `HEADLESS.md`
            are attached for the headless CLI.
