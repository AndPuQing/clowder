name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-2022]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      # MyGo's native UI needs GTK3 + WebKitGTK 4.1 on Linux
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev pkg-config

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          out="$(gofmt -l cmd core ui)"
          if [ -n "$out" ]; then
            echo "these files need gofmt:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test ./...

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/AndPuQing/clowder/core.Version=${{ github.sha }}" \
            -o dist/clowder${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/clowder
          go build -trimpath \
            -ldflags "-s -w -X github.com/AndPuQing/clowder/core.Version=${{ github.sha }}" \
            -o dist/clowderd${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/clowderd

      - name: Smoke test
        if: runner.os == 'Linux'
        run: ./dist/clowder --version | grep -q '^clowder '